apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: geektime-docs

spec:
  ingressClassName: traefik

  rules:
    - host: geektime.linkozhao.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: geektime-docs
                port:
                  number: 80
